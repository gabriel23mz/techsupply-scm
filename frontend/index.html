<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="TechSupply SCM - Sistema de Gestión Logística Outbound."
  />

  <meta
    name="author"
    content="TechSupply SCM"
  />

  <meta
    name="theme-color"
    content="#f4f7fb"
  />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <script>
    (() => {
      try {
        const stored = JSON.parse(
          localStorage.getItem('techsupply_preferences') || '{}',
        );
        const preference = ['system', 'light', 'dark'].includes(stored.theme)
          ? stored.theme
          : 'system';
        const systemDark = window.matchMedia(
          '(prefers-color-scheme: dark)',
        ).matches;
        const theme = preference === 'system'
          ? systemDark ? 'dark' : 'light'
          : preference;

        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.style.colorScheme = theme;
      } catch {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>

  <title>TechSupply SCM</title>
</head>

<body>
  <div id="root"></div>

  <script
    type="module"
    src="/src/main.jsx"
  ></script>
</body>

</html>
